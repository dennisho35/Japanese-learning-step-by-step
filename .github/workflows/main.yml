name: Build Android APK (日語一步通)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 自動編譯 Android 離線安裝檔 (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter SDK (3.22.3 Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: 4. Auto-Heal Source Files, Pin Plugin Versions & Build APK
        run: |
          set -e
          PUBSPEC_FILE=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "❌ 找不到 pubspec.yaml，請確認已將專案檔案上傳至 GitHub 儲存庫！"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
          echo "📂 偵測到 Flutter 專案目錄: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 先移除半成品的 android/ 與 ios/，由 Flutter SDK 產生 100% 完整且版本一致的原生專案結構
          rm -rf android ios
          flutter create --platforms=android,ios --project-name japanese_step_by_step --org com.japanesestepbystep .
          # 移除 flutter create 自動產生且與本專案不相容的預設 widget_test.dart
          rm -f test/widget_test.dart

          # 第一階段自動修補：鎖定 pubspec.yaml 相容套件版本（防止拉取到需要 SDK 36 與 Kotlin 2.2 的新版插件）並修補 Dart 檔案
          python3 - << 'PYEOF'
          import glob, os, re

          # 0. 強制鎖定 pubspec.yaml 內套件版本（移除 ^ 符號，避免自動升級至 Kotlin 2.2.20 / SDK 36 的 flutter_tts 4.2.5）
          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  pub = f.read()
              pub = re.sub(r"flutter_tts:\s*\^?[\d\.\+]+", "flutter_tts: 4.0.2", pub)
              pub = re.sub(r"shared_preferences:\s*\^?[\d\.\+]+", "shared_preferences: 2.2.3", pub)
              pub = re.sub(r"path_provider:\s*\^?[\d\.\+]+", "path_provider: 2.1.3", pub)
              pub = re.sub(r"permission_handler:\s*\^?[\d\.\+]+", "permission_handler: 11.3.1", pub)
              pub = re.sub(r"speech_to_text:\s*\^?[\d\.\+]+", "speech_to_text: 6.6.2", pub)
              pub = re.sub(r"sqflite:\s*\^?[\d\.\+]+", "sqflite: 2.3.3+1", pub)
              with open("pubspec.yaml", "w", encoding="utf-8") as f:
                  f.write(pub)

          # A. 自動修補 StudyProgressService（修正 Map<String, String> 型別轉換與單元測試非同步 SharedPreferences 例外）
          sps_path = "lib/services/study_progress_service.dart"
          if os.path.exists(sps_path):
              with open(sps_path, "r", encoding="utf-8") as f:
                  sps = f.read()
              sps = sps.replace(
                  "(data['kanaStatus'] as Map<String, dynamic>? ?? {}).forEach((k, v) {\n      kanaStatus[k] = v as String;\n    });",
                  "if (data['kanaStatus'] is Map) { (data['kanaStatus'] as Map).forEach((k, v) { kanaStatus[k.toString()] = v.toString(); }); }"
              )
              sps = sps.replace(
                  "(data['handwritingPracticeCount'] as Map<String, dynamic>? ?? {}).forEach((k, v) {\n      handwritingPracticeCount[k] = v as int;\n    });",
                  "if (data['handwritingPracticeCount'] is Map) { (data['handwritingPracticeCount'] as Map).forEach((k, v) { handwritingPracticeCount[k.toString()] = (v as num).toInt(); }); }"
              )
              sps = sps.replace(
                  "(data['mistakeBook'] as Map<String, dynamic>? ?? {}).forEach((k, v) {\n      mistakeBook[k] = MistakeRecord.fromJson(v as Map<String, dynamic>);\n    });",
                  "if (data['mistakeBook'] is Map) { (data['mistakeBook'] as Map).forEach((k, v) { mistakeBook[k.toString()] = MistakeRecord.fromJson(Map<String, dynamic>.from(v as Map)); }); }"
              )
              if "try {" not in sps:
                  sps = sps.replace(
                      "Future<void> saveToLocal() async {\n    final prefs = await SharedPreferences.getInstance();\n    await prefs.setString(_storageKey, jsonEncode(toJsonMap()));\n  }",
                      "Future<void> saveToLocal() async {\n    try {\n      final prefs = await SharedPreferences.getInstance();\n      await prefs.setString(_storageKey, jsonEncode(toJsonMap()));\n    } catch (_) {}\n  }"
                  )
              with open(sps_path, "w", encoding="utf-8") as f:
                  f.write(sps)

          # B. 自動修補 test/curriculum_and_logic_test.dart
          test_path = "test/curriculum_and_logic_test.dart"
          if os.path.exists(test_path):
              with open(test_path, "r", encoding="utf-8") as f:
                  tc = f.read()
              if "SharedPreferences.setMockInitialValues" not in tc:
                  tc = "import 'package:shared_preferences/shared_preferences.dart';\n" + tc
                  tc = tc.replace(
                      "setUpAll(() {",
                      "TestWidgetsFlutterBinding.ensureInitialized();\n  setUpAll(() {\n    SharedPreferences.setMockInitialValues({});"
                  )
                  with open(test_path, "w", encoding="utf-8") as f:
                      f.write(tc)

          # C. 自動修補 lib/ 內舊版 Dart 語法問題
          for df in glob.glob("lib/**/*.dart", recursive=True):
              with open(df, "r", encoding="utf-8") as f:
                  src = f.read()
              orig = src
              src = src.replace("Icons.TouchApp_outlined", "Icons.touch_app_outlined")
              src = src.replace("${item.note}\n例句：", "${item.note}\\n例句：")
              src = src.replace("${q.explanation}\n建議重溫：", "${q.explanation}\\n建議重溫：")
              src = src.replace("${rec.intervalDays} 天\n正解：", "${rec.intervalDays} 天\\n正解：")
              src = src.replace("${q.options[q.correctIndex]}\n詳解：", "${q.options[q.correctIndex]}\\n詳解：")
              src = src.replace("import 'package:path/path.dart';\n", "")
              src = src.replace("final path = join(dbPath, filePath);", "final path = '$dbPath/$filePath';")
              src = re.sub(r"cardTheme:\s*CardTheme\([^;]*?\),\s*\n", "", src, flags=re.DOTALL)
              if src != orig:
                  with open(df, "w", encoding="utf-8") as f:
                      f.write(src)
          PYEOF

          # 移除舊的 pubspec.lock 後重新下載鎖定版本的套件並執行單元測試
          rm -f pubspec.lock
          flutter pub get
          flutter test test/curriculum_and_logic_test.dart

          # 第二階段自動修補：修補 Android 設定與 .pub-cache 所有插件的 Kotlin / compileSdk 版本衝突
          python3 - << 'PYEOF'
          import glob, os, re

          # D. 修補 AndroidManifest.xml（注入 RECORD_AUDIO 與 Android 11+ TTS/STT <queries>）
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  m = f.read()
              if "android.permission.RECORD_AUDIO" not in m:
                  m = m.replace("<application", '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n\n    <application', 1)
              if "android.intent.action.TTS_SERVICE" not in m:
                  q = '<queries>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>'
                  m = m.replace("<queries>", q, 1) if "<queries>" in m else m.replace("<application", q + "\n    </queries>\n    <application", 1)
              m = re.sub(r'android:label="[^"]*"', 'android:label="日語一步通"', m, count=1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(m)

          # E. 修補 android/app/build.gradle (compileSdk 34, minSdk 23, targetSdk 34)
          for gp in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(gp):
                  with open(gp, "r", encoding="utf-8") as f:
                      g = f.read()
                  g = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdk = 34", g)
                  g = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 34", g)
                  g = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdk = 23", g)
                  g = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", g)
                  g = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 23", g)
                  g = re.sub(r"targetSdk\s*=?\s*flutter\.targetSdkVersion", "targetSdk = 34", g)
                  g = re.sub(r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 34", g)
                  with open(gp, "w", encoding="utf-8") as f:
                      f.write(g)

          # F. 統一升級 Kotlin 至 1.9.22，並強制鎖定所有子專案 kotlin-stdlib 為 1.9.22（徹底消除 Metadata 2.2.0 vs 1.9.0 錯誤）
          for sp in ["android/settings.gradle", "android/settings.gradle.kts", "android/build.gradle"]:
              if os.path.exists(sp):
                  with open(sp, "r", encoding="utf-8") as f:
                      s = f.read()
                  s = re.sub(r'(org\.jetbrains\.kotlin\.android["\']?\s+version\s+["\'])[\d\.]+(["\'])', r"\g<1>1.9.22\g<2>", s)
                  s = re.sub(r"(ext\.kotlin_version\s*=\s*['\"])[\d\.]+(['\"])", r"\g<1>1.9.22\g<2>", s)
                  with open(sp, "w", encoding="utf-8") as f:
                      f.write(s)

          # 掃描 .pub-cache 下所有插件的 build.gradle，將任何過高的 kotlin_version (如 2.2.20) 或 compileSdk (35/36) 統一對齊為 1.9.22 與 34
          pub_cache = os.path.expanduser("~/.pub-cache")
          for pbg in glob.glob(f"{pub_cache}/hosted/pub.dev/*/android/build.gradle"):
              with open(pbg, "r", encoding="utf-8") as f:
                  pc = f.read()
              orig_pc = pc
              pc = re.sub(r"(ext\.kotlin_version\s*=\s*['\"])[\d\.]+(['\"])", r"\g<1>1.9.22\g<2>", pc)
              pc = re.sub(r"(kotlin-gradle-plugin:)[\d\.]+", r"\g<1>1.9.22", pc)
              pc = re.sub(r"(kotlin-stdlib[a-z0-9\-]*:)[\d\.]+", r"\g<1>1.9.22", pc)
              pc = re.sub(r"compileSdkVersion\s+3[356]", "compileSdkVersion 34", pc)
              pc = re.sub(r"compileSdk\s*=?\s*3[356]", "compileSdk = 34", pc)
              if pc != orig_pc:
                  print(f"🔧 已自動對齊插件 Gradle 設定: {pbg}")
                  with open(pbg, "w", encoding="utf-8") as f:
                      f.write(pc)

          root_bg = "android/build.gradle"
          if os.path.exists(root_bg):
              with open(root_bg, "r", encoding="utf-8") as f:
                  rbg = f.read()
              gradle_fix = """
          ext.kotlin_version = '1.9.22'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.22"
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion '1.9.22'
                          }
                      }
                  }
              }
          }
          subprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "1.8"
                      freeCompilerArgs += ["-Xskip-metadata-version-check"]
                  }
              }
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          }
          """
              if "resolutionStrategy" not in rbg:
                  rbg = gradle_fix + "\n" + rbg
                  with open(root_bg, "w", encoding="utf-8") as f:
                      f.write(rbg)
          PYEOF

          # 編譯 Release APK
          flutter build apk --release --no-tree-shake-icons

          mkdir -p "$GITHUB_WORKSPACE/apk_output"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/apk_output/japanese-step-by-step-release.apk"

      - name: 5. Upload Compiled APK Artifact (點擊下載 APK)
        uses: actions/upload-artifact@v4
        with:
          name: japanese-step-by-step-apk
          path: apk_output/japanese-step-by-step-release.apk
