name: japanese_step_by_step
description: 日語一步通 (Japanese Step-by-Step) - 專為零基礎繁體中文學習者打造的跨平台日語學習 App (Android + iOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 本機持久化儲存（支援離線學習進度、SRS 錯題本與收藏）
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  # 系統原生語音合成 (TTS) 與語音辨識 (STT)
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/japanese_curriculum.json
